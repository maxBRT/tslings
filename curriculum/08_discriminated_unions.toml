# DISCRIMINATED UNIONS

[[exercises]]
name = "discriminated1"
dir = "08_discriminated_unions"
hint = """
Write `switch (message.kind) { case "text": ... }` with one `case` per member.
Inside each `case`, hover `message`: TypeScript has narrowed it to that member,
so its fields are available. `caption` is optional, so check it before using it.
https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"""

[exercises.error_notes]
TS2339 = "Before narrowing, you can only read the fields that every member of `Message` has, and that's only `kind`. Check `message.kind` first: in each branch, TypeScript knows which member you have and lets you read its fields."

[[exercises]]
name = "discriminated2"
dir = "08_discriminated_unions"
hint = """
`destination` already has the exhaustiveness check: read its error, add the
missing `case`. In `costInCents`, replace `default: return 0;` with the same kind
of check (`const unhandled: never = notification;` or
`notification satisfies never;`, then a `throw`), and do what its error says.
https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking"""

[exercises.error_notes]
TS2322 = "This is the exhaustiveness check doing its job. No `case` handles the \"push\" member, so it reaches `default`, where only `never` (no value at all) may arrive. Add a `case` for it above, and this line compiles again."
TS1360 = "This is the exhaustiveness check doing its job: the member named in the message reaches `default` because no `case` handles it. Add that `case` above."

[[exercises]]
name = "discriminated3"
dir = "08_discriminated_unions"
hint = """
Write `ProfileState` as four object types joined with `|`, each with a literal
`status`: `{ status: "idle" } | { status: "loading" } | ...`. Only the success
member has a `user` (required, no `?`), only the error member has an `error`.
Once the type is right, `render` compiles as it is.
https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"""

[exercises.error_notes]
TS18048 = "Don't patch this line. With optional fields, checking `status` tells TypeScript nothing about `user` or `error`: the type allows a \"success\" without a user. Change `ProfileState` so that the success state always has a `user` and the error state always has an `error`."
TS2344 = "A type-level test failed: `ProfileState` doesn't have the shape the tests describe yet. Each status needs its own member of the union, with only the fields that exist in that state: a required `user` in \"success\", a required `error` in \"error\", and nothing but `status` in the other two."

[[exercises]]
name = "discriminated4"
dir = "08_discriminated_unions"
hint = """
In `invoiceTitle`, replace the two lines with one destructuring:
`const { data, error } = result;`. Checking `error` then narrows `data`.
`unwrapInvoice` destructures its parameter, which links them too: check
`error`, throw `new Error(...)` with its message, and return `data` after that.
https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-6.html#control-flow-analysis-for-destructured-discriminated-unions"""

[exercises.error_notes]
TS18047 = "You checked `error`, but `data` was copied out of `result` on its own line, so TypeScript treats it as an unrelated variable: it's still `Invoice | null`. Destructure `data` and `error` together in one `const { ... } = result;`, and checking one narrows the other."
TS2322 = "`data` is `null` when the query failed. Check `error` first: `data` and `error` come from the same destructured parameter, so once `error` is known to be `null`, `data` is an `Invoice`."

[[exercises]]
name = "discriminated5"
dir = "08_discriminated_unions"
hint = """
Add one `case` per action named in the error, above the `default`. Inside
`case "seek":`, TypeScript knows `action.seconds` exists. The current track is
`state.queue[state.index]`, which is `undefined` when the queue is empty, so
check it before reading its length. To declare a `const` inside a `case`, wrap
the case's body in braces: `case "seek": { ... }`.
https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"""

[exercises.error_notes]
TS1360 = "The exhaustiveness check lists the actions that no `case` handles yet. Add a `case` for each of them above the `default`; when the list is empty, this line compiles."

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check that the committed build matches the sources
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf dist
          npm run build
          git diff --exit-code --stat -- dist
          test -z "$(git status --porcelain -- dist)"
      - run: npm test
      - name: Check the official exercises and solutions
        run: node src/main.ts dev check --require-solutions

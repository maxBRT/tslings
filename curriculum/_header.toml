format_version = 1

welcome_message = """
Is this your first time? Don't worry, tslings is made for beginners!
We are going to teach you a lot of things about TypeScript, but before we can
get started, here are some notes about how tslings operates:

1. The central concept behind tslings is that you solve exercises. These
   exercises usually contain some type errors or logic errors which cause the
   exercise to fail type-checking or testing. It's your job to find all errors
   and fix them!
2. Make sure to have your editor open in the `tslings/` directory. tslings
   will show you the path of the current exercise under the progress bar. Open
   the exercise file in your editor, fix errors and save the file. tslings
   will automatically detect the file change and rerun the exercise. If all
   errors are fixed, tslings will ask you to move on to the next exercise.
3. Every exercise is checked in three steps: TypeScript type-checks it, the
   tslings linter makes sure the type checker wasn't silenced (no `any`, no
   `as` assertions, no `!`, no `@ts-ignore`), then Node.js runs it. Node runs
   TypeScript files directly: it erases the types, nothing else changes.
4. If you're stuck on an exercise, enter `h` to show a hint.
5. If an exercise doesn't make sense to you, feel free to open an issue on
   GitHub! (https://github.com/maxBRT/tslings). We look at every issue, and
   sometimes, other learners do too so you can help each other out!"""

final_message = """
We hope you enjoyed learning about the various aspects of TypeScript!
If you noticed any issues, don't hesitate to report them on GitHub.
You can also contribute your own exercises to help the greater community!

Before reporting an issue or contributing, please read our guidelines:
https://github.com/maxBRT/tslings/blob/main/CONTRIBUTING.md"""

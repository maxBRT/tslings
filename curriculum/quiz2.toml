# QUIZ 2

[[exercises]]
name = "quiz2"
dir = "quizzes"
hint = """
`applyEvent`: `switch (event.type)`, check `order.status` in each `case`, return
`undefined` for refused moves, and end with a `never` check. `...order` copies
every field, so only spread when you want all of them: TypeScript doesn't flag
extra fields that come from a spread, but the tests compare the whole object.
`processEvents`: `new Map(orders)` makes a copy; `get` can return `undefined`.
`findOrder`: `typeof query` tells the two kinds of query apart, and only shipped
orders have a tracking number."""

[exercises.error_notes]
TS2355 = "This function never returns a value, but its return type promises one. Even a return type that includes `undefined` needs explicit `return` statements. Write the function as its TODO describes."

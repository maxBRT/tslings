# COLLECTIONS

[[exercises]]
name = "collections1"
dir = "06_collections"
hint = """
Type arguments go between `<` and `>` right after `Map`: first the key type,
then the value type.
Once the Map is typed, `get` returns `number | undefined`. A client that isn't
in the Map yet has made 0 requests: supply that default (`??` does it in one
step). In `remaining`, call `get` once, store the result, and compare it with
`undefined` instead of calling `has`.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map"""

[exercises.error_notes]
TS2344 = "`requestCounts` is a `Map<any, any>`: `new Map()` has no entries and no type arguments to learn its types from. Write the key and value types between `<>` after `Map`, then fix the errors that appear."
TS2532 = "`get` returns `number | undefined`: the client may not be in the Map. Give it a default, or check the value you got back. A `has` check doesn't help, since TypeScript doesn't link it to the `get` call."

[[exercises]]
name = "collections2"
dir = "06_collections"
hint = """
Put the element type between `<>` after `Set`, as the tests do with
`new Set<Permission>(...)`.
Each function body is one expression made of the methods listed at the top:
they return new sets, so you can chain them (`a.union(b).difference(c)`).
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set#set_composition"""

[exercises.error_notes]
TS2355 = "This function is still empty. Return a value built with the Set methods listed at the top of the file."
TS2322 = "`VIEWER` and `EDITOR` were inferred as `Set<string>`, and not every string is a `Permission`. Give `new Set` the element type explicitly where the constants are declared: `new Set<Permission>([...])`."

[[exercises]]
name = "collections3"
dir = "06_collections"
hint = """
Annotate the constant with `Record<Plan, number>` and write it as an object
literal: `{ free: 0, ... }`. Reading a price is then `MONTHLY_PRICE[plan]`.
For the list, `Object.entries(obj)` returns `[key, value]` pairs: destructure
each pair in the `map` callback's parameter.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/entries"""

[exercises.error_notes]
TS2322 = "A Map can't promise that a key is present, so `get` returns `number | undefined`, even though the keys are a fixed set of plans. A `Record<Plan, number>` object requires every plan, so reading one is always a `number`."
TS2741 = "A `Record<Plan, number>` needs a price for every plan, and this object is missing one. Add it: that check is what the `Record` buys you over a Map."
TS2739 = "`MONTHLY_PRICE` is still a Map. A Map keeps its entries inside, not as properties, so it isn't a `Record<Plan, number>`. Turning it into a Record (the first TODO) fixes this error too."
TS7053 = "`plan` is a `string` here, because `Object.keys` always returns `string[]`: a value may have more properties at runtime than its type says. Use `Object.entries` to get each price together with its key, instead of indexing with a `string`."

[[exercises]]
name = "collections4"
dir = "06_collections"
hint = """
`groups.pending` is `Order[] | undefined`: there's no `pending` key at all when
no order is pending. Use 0 for missing groups, with `?.` and `??` or a check.
`Map.groupBy` takes the same arguments as `Object.groupBy` and returns a Map:
read its groups with `get`.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map/groupBy"""

[exercises.error_notes]
TS18048 = "`Object.groupBy` returns a `Partial<Record<Status, Order[]>>`: a status with no orders has no key in the result, so each group may be `undefined`."
TS2322 = "`Object.groupBy` builds a plain object, so its callback must return a property key: a string, a number or a symbol. A boolean isn't one. `Map.groupBy` groups into a Map, whose keys can be of any type, booleans included."

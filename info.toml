TS2741 = "That's what `as Route` was hiding: the fallback has no `auth` field, so `notFound.auth` was `undefined` at runtime. Add the field."
TS2339 = "`notFound` has no `auth` field, and with `satisfies` its type is exactly what the object holds. Add `auth` to the object itself (see the error on `satisfies Route`)."
TS2322 = "`current` was inferred from `notFound`, so its type is that one route: `method: \"GET\"`, `auth: false`. No other route fits. A variable that will hold any route needs the wider `Route` type, and that's the job of an annotation."


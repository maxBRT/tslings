[[exercises]]
name = "quiz4"
dir = "quizzes"
hint = """
(1) A built-in utility type keeps the members of a union that fit a shape: `{ type: Type }`.
(2) Each reducer returns a new cart with `{ ...cart, ... }`; `event` is already narrowed.
(3) `for await (const event of events)`, and keep the current cart in a `let`.
(4) Map over `Event["type"]` and rename each key with `as` and a template literal type."""

[exercises.error_notes]
TS18046 = "`event` is `unknown` because `EventOf` is still `unknown` (TODO 1). Once `EventOf<Type>` picks the right member of `CartEvent`, each reducer knows exactly which event it gets."
TS2739 = "`Reducers` has one entry per event type, so the object must handle all of them. That's TODO 2: TypeScript lists the missing ones."
TS7053 = "On `reducers[event.type]`, this comes from `event` being `unknown`, and goes away with TODO 1. On `counts[...]`, `EventCounts` is still `{}` (TODO 4), so it has no counter keys to index."
TS2339 = "`EventOf` is still `unknown` (TODO 1), and `unknown` has no `type` property."

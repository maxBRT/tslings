# This file is generated from the files in `curriculum/` by `node scripts/assemble-info.ts`
# (or `tslings dev update` in the tslings repository). Edit those files instead.

format_version = 1

welcome_message = """
Is this your first time? Don't worry, tslings is made for beginners!
We are going to teach you a lot of things about TypeScript, but before we can
get started, here are some notes about how tslings operates:

1. The central concept behind tslings is that you solve exercises. These
   exercises usually contain some type errors or logic errors which cause the
   exercise to fail type-checking or testing. It's your job to find all errors
   and fix them!
2. Make sure to have your editor open in the `tslings/` directory. tslings
   will show you the path of the current exercise under the progress bar. Open
   the exercise file in your editor, fix errors and save the file. tslings
   will automatically detect the file change and rerun the exercise. If all
   errors are fixed, tslings will ask you to move on to the next exercise.
3. Every exercise is checked in three steps: TypeScript type-checks it, the
   tslings linter makes sure the type checker wasn't silenced (no `any`, no
   `as` assertions, no `!`, no `@ts-ignore`), then Node.js runs it. Node runs
   TypeScript files directly: it erases the types, nothing else changes.
4. If you're stuck on an exercise, enter `h` to show a hint.
5. If an exercise doesn't make sense to you, feel free to open an issue on
   GitHub! (https://github.com/maxBRT/tslings). We look at every issue, and
   sometimes, other learners do too so you can help each other out!"""

final_message = """
We hope you enjoyed learning about the various aspects of TypeScript!
If you noticed any issues, don't hesitate to report them on GitHub.
You can also contribute your own exercises to help the greater community!

Before reporting an issue or contributing, please read our guidelines:
https://github.com/maxBRT/tslings/blob/main/CONTRIBUTING.md"""

# -------------------- 00_intro.toml --------------------

[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
This exercise already passes, there's nothing to fix. Change the name passed to
`welcome`, save the file, and watch the output change.
Then enter `n` to move on to the next exercise."""

[[exercises]]
name = "intro2"
dir = "00_intro"
test = false
hint = """
TypeScript reports that `user` has no property with that name, and it suggests
one that exists. Compare the two spellings."""

[exercises.error_notes]
TS2551 = "TypeScript inferred the shape of `user` from the object literal, so it knows every property `user` has. Reading one that doesn't exist is almost always a typo. JavaScript would quietly give you `undefined` instead."

# -------------------- 01_variables.toml --------------------

[[exercises]]
name = "variables1"
dir = "01_variables"
hint = """
`total` changes on every turn of the loop, so it can't be a `const`.
`shippingCents` never changes: the warning suggests the keyword it should use.
https://www.typescriptlang.org/docs/handbook/variable-declarations.html"""

[exercises.error_notes]
TS2588 = "A `const` keeps the value it was declared with. This variable is updated on every turn of the loop, so declare it with `let` instead."

[[exercises]]
name = "variables2"
dir = "01_variables"
hint = """
Look at the value `longest` starts with. TypeScript infers the variable's type from
it, and that type can't change afterwards. Start it with a value of the type you
want it to hold, one that also makes sense when there are no tags at all.
https://www.typescriptlang.org/docs/handbook/type-inference.html"""

[exercises.error_notes]
TS2365 = "`longest` was initialized with a string, so TypeScript inferred the type `string` for it, and `tag.length` is a number. Comparing a number with a string is almost always a bug. Look at the line that declares `longest`."
TS2322 = "`longest` holds whatever type its initial value had, and that type is fixed. Fix the initial value and this error goes away too."

[[exercises]]
name = "variables3"
dir = "01_variables"
hint = """
Follow the `if` and `else if` with a standard order in mind: not express, and a
subtotal under 5000 cents. Which branch assigns `fee` for it?
The `if` needs one more branch for every order the first two don't cover."""

[exercises.error_notes]
TS2454 = "TypeScript followed every path through the `if` above and found one where nothing assigns `fee`. On that path, JavaScript would return `undefined`. Add the missing branch."

[[exercises]]
name = "variables4"
dir = "01_variables"
hint = """
`let method = "GET"` gets the type `string`, because a `let` could be set to any
string later. Does `method` ever change? Then declare it so TypeScript keeps its
literal type. The same goes for `path`, as the warning says.
https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-types"""

[exercises.error_notes]
TS2345 = "`method` is declared with `let`, so TypeScript widened its type from `\"GET\"` to `string`: a later line could set it to any string. `request` only accepts three specific strings. Does `method` need to change?"
TS2344 = "A type test failed: `method` must have the literal type `\"GET\"`, the type TypeScript infers for a variable that can never change. Calling `request(\"GET\", ...)` directly would compile, but it doesn't answer the question this exercise asks."

[[exercises]]
name = "variables5"
dir = "01_variables"
hint = """
A type annotation goes after the variable name: `let name: Type = value;`.
Once `state` has the `ConnectionState` type, TypeScript checks every string you assign
to it. If a new error appears, read it closely: it's a bug the tests would also catch."""

[exercises.error_notes]
TS2345 = "`let state = \"connecting\"` gives `state` the type `string`, since a `let` can change. `statusText` only accepts a `ConnectionState`. Annotate `state` with that type where it's declared."
TS2322 = "Now that `state` is a `ConnectionState`, TypeScript checks every string assigned to it, and this one isn't one of the three. Look at its spelling."
TS2344 = "A type test failed: `statusText` must keep accepting only a `ConnectionState`. Leave it as it was, and give the variable you pass to it a precise type instead."

# -------------------- 02_functions.toml --------------------

[[exercises]]
name = "functions1"
dir = "02_functions"
hint = """
A parameter annotation goes after the parameter name: `(name: string, age: number)`.
Read each function body to see how every parameter is used: text, a number, or a
yes/no flag? The same syntax works for the arrow function.
https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#functions"""

[exercises.error_notes]
TS7006 = "TypeScript doesn't guess parameter types from how the body uses them, so a parameter without an annotation would be `any`, and `strict` forbids that. Write its type after its name, e.g. `quantity: number`."
TS2344 = "A type test failed: it compares the type of each function with the expected one. Annotate every parameter with the type its body needs, and these tests pass too."

[[exercises]]
name = "functions2"
dir = "02_functions"
hint = """
A return type annotation goes after the parameter list: `function f(x: number): string {`.
Once `formatDuration` promises a `string`, TypeScript reports the `return` that breaks the
promise. Look at what the tests expect for whole minutes."""

[exercises.error_notes]
TS2339 = "`formatDuration` returns a number on one of its paths, so TypeScript inferred `string | number` as its return type, and a number has no `padStart`. This line is fine: the mistake is inside `formatDuration`. Annotate its return type and TypeScript will report the line that's actually wrong."
TS2344 = "A type test failed: `formatDuration` must return a `string` on every path."
TS2322 = "`formatDuration` now promises to return a `string`, and this `return` breaks the promise. Without the annotation, this mistake was only visible as an error in `playlistRow`."

[[exercises]]
name = "functions3"
dir = "02_functions"
hint = """
A parameter with a default value needs no annotation: `pageSize = 20` (TypeScript infers
`number` from it). An optional parameter keeps its type and gets a `?`: `search?: string`.
Optional parameters must come after the required ones.
https://www.typescriptlang.org/docs/handbook/2/functions.html#optional-parameters"""

[exercises.error_notes]
TS2554 = "`productsUrl` declares three required parameters, but this call passes fewer. Fix the function's signature, not the calls: make the last two parameters optional."
TS2344 = "A type test failed: compare the signature of `productsUrl` with the one the test expects. Both `pageSize` and `search` must be optional for callers."
TS18048 = "With `?`, a parameter is `undefined` when the caller leaves it out, and TypeScript won't let you multiply `undefined`. A default value (`pageSize = 20`) makes it optional and always a number."
TS2345 = "Passing `undefined` for a parameter that has a default value gives you the default. That only compiles once the parameter is optional."

[[exercises]]
name = "functions4"
dir = "02_functions"
hint = """
A function type has the shape `(parameter: Type) => ReturnType`.
A rest parameter collects every remaining argument into an array, so its annotation is
an array type: `...names: string[]`, here with your `PriceRule` instead of `string`.
https://www.typescriptlang.org/docs/handbook/2/functions.html#function-type-expressions"""

[exercises.error_notes]
TS7019 = "A rest parameter collects the remaining arguments into an array, so its type is an array type, like `string[]`. Here it's an array of price rules."
TS7006 = "An arrow function without annotations gets its parameter types from the function type expected where it's written. Here there isn't one yet: either `PriceRule` is still `unknown`, or `rules` has no type. Fix both and this error disappears, without annotating `price`."
TS18046 = "`rule` is a `PriceRule`, and `PriceRule` is still `unknown`, so TypeScript doesn't know it can be called. Define `PriceRule` as a function type."
TS2344 = "A type test failed: `PriceRule` must be a function type that takes a number and returns a number, and `rules` must be an array of `PriceRule`. Until `PriceRule` is defined, the expected types show it as `unknown`."

[[exercises]]
name = "functions5"
dir = "02_functions"
hint = """
`push` returns the new length of the array, a number, so `(event) => auditLog.push(event)`
returns a number too. Which return type means "I won't use the result"?
https://www.typescriptlang.org/docs/handbook/2/functions.html#return-type-void"""

[exercises.error_notes]
TS2322 = "`Listener` says that listeners return `undefined`, but `push` returns a number (the array's new length). `emit` never uses what listeners return, so the type is stricter than it needs to be. Change `Listener`, not the listeners."
TS2344 = "A type test failed: a listener's return type should say \"ignored\", whatever the listener returns."

# -------------------- 03_primitives_literals.toml --------------------

[[exercises]]
name = "primitives1"
dir = "03_primitives_literals"
hint = """
TypeScript tells you how to test for `NaN`: read the whole error message.
For `formatPrice`, look for a method of numbers that formats them with a fixed number
of decimals. A template string won't add the trailing zero.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/toFixed"""

[exercises.error_notes]
TS2845 = "`NaN` is the only value that isn't equal to itself, so `x === NaN` is false even when `x` is `NaN`. TypeScript knows this comparison can never succeed. Use `Number.isNaN(x)`."
TS2322 = "`cents / 100` is a `number`, and `formatPrice` promises a `string`. Numbers have a method that rounds them to a number of decimals and returns the result as a string."

[[exercises]]
name = "primitives2"
dir = "03_primitives_literals"
hint = """
A `bigint` literal ends with `n`: `1_000_000n`. To go from one type to the other,
call `Number(...)` or `BigInt(...)`.
In `elapsedMs`, the timestamps are huge but their difference is small: convert at the
point where no precision is lost, and remember that bigint division drops decimals.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt"""

[exercises.error_notes]
TS2365 = "One side of this operator is a `bigint` and the other a `number`. JavaScript throws a TypeError when you mix them, and TypeScript reports it before that. Convert one side with `Number(...)` or `BigInt(...)`, or write a bigint literal like `1_000_000n`."
TS2322 = "The function promises one numeric type and this expression has the other. `number` and `bigint` don't convert implicitly: use `Number(...)` or `BigInt(...)`."

[[exercises]]
name = "primitives3"
dir = "03_primitives_literals"
hint = """
A return type that may be `null` is a union: `string | null`.
Then, in `ratingLabel`, compare the average with `null` and return early. After that
check, TypeScript knows the average is a plain `number`.
https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#null-and-undefined"""

[exercises.error_notes]
TS2322 = "`averageRating` promises a `number`, and with `strict` on, `null` isn't a number. If `null` is a legitimate answer, the return type must include it."
TS18047 = "`averageRating` can return `null`, and `null` has no `toFixed`. In JavaScript this line would crash with \"Cannot read properties of null\". Check for `null` first, and return the label for products without reviews."
TS2344 = "A type test failed: the return type of `averageRating` must say that it can return `null`."

[[exercises]]
name = "literals1"
dir = "03_primitives_literals"
hint = """
A union of literal types is written with `|` between the values: `"a" | "b"`.
Once `LogLevel` is a union, TypeScript knows which strings `level` can be at every
line of `severity`, and it rejects a comparison that can never be true.
https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-types"""

[exercises.error_notes]
TS2344 = "A type test failed: `LogLevel` is still `string`, so it accepts any text, typos included. Replace it with a union of the four level names."
TS2367 = "TypeScript has already ruled out \"debug\" and \"info\" on this line, so `level` can only be \"warn\" or \"error\", never the string it's compared with. That's a typo `string` was hiding."

[[exercises]]
name = "literals2"
dir = "03_primitives_literals"
hint = """
Add `as const` right after the array literal. `Plan` is already derived from `PLANS`.
Once `Plan` is a union, TypeScript checks every value typed `Plan` against the list, and
one of them isn't in it. The test names tell you which plan it should be.
https://www.typescriptlang.org/docs/handbook/release-notes/typescript-3-4.html#const-assertions"""

[exercises.error_notes]
TS2344 = "A type test failed: `PLANS` is inferred as `string[]`, so `Plan` is just `string`. Tell TypeScript the array never changes, so it keeps the literal types."
TS2322 = "`Plan` now only accepts the names listed in `PLANS`, and this one isn't there. While `Plan` was `string`, any text passed, typos and outdated plan names included. The tests say which plan new accounts start on."

# -------------------- 04_arrays_tuples.toml --------------------

# ARRAYS AND TUPLES

[[exercises]]
name = "arrays1"
dir = "04_arrays_tuples"
hint = """
`scores` needs an array type: `number[]` reads "array of numbers". Put
`readonly` in front of it, like the parameter of `topThree`.

A `readonly` array has no `sort`, because `sort` reorders the array in place.
Look for a method that returns a sorted copy instead, or sort a copy you made
with spread syntax.
https://www.typescriptlang.org/docs/handbook/2/objects.html#the-readonlyarray-type"""

[exercises.error_notes]
TS7006 = "Without an annotation, `scores` would be `any`, and `strict` forbids that. It's a list of numbers that `averageScore` only reads: type it the way `topThree` types its parameter."
TS2339 = "`readonly number[]` has none of the methods that change an array, so `sort` (which sorts in place) is gone. ES2023 added copying versions of the mutating methods: look for one that returns a sorted copy."
TS2344 = "A type test failed: `averageScore` must take a `readonly number[]`, like `topThree`, so that neither function can change the caller's scores."

[[exercises]]
name = "arrays2"
dir = "04_arrays_tuples"
hint = """
Each function reads `xs[i]`, which TypeScript types as possibly `undefined`.
- `totalMinutes`: a `for...of` loop hands you the elements directly.
- `lastMessage`: `messages.at(-1)` is the last element or `undefined`.
  Check for `undefined` (or use `??`) to return the fallback text.
- `parseArgs`: destructure `argv` and give each element a default with `=`.
https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess"""

[exercises.error_notes]
TS2532 = "With `noUncheckedIndexedAccess`, `sessions[i]` is `number | undefined`: TypeScript doesn't connect the index to the loop condition. Iterate over the elements themselves instead of over indexes."
TS2322 = "The last element of an array is `string | undefined`, whether you read it with an index or with `.at(-1)`: the array may be empty. Checking `messages.length` first doesn't help, because TypeScript doesn't connect the length to the index. Read the element, then check that value for `undefined` (or use `??`)."
TS18048 = "Reading `argv[0]` or `argv[1]` gives `string | undefined`: the user may not have passed that argument. Destructuring with a default (`const [a = \"x\"] = list`) gives you a plain `string`."

[[exercises]]
name = "arrays3"
dir = "04_arrays_tuples"
hint = """
`Boolean` is a plain function returning `boolean`, so `filter` can't tell
which type survives, and it drops the score `0` because `0` is falsy.
Write the callback yourself, as an arrow function that compares the value
with `undefined`. TypeScript infers the type predicate for you.
https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-5.html#inferred-type-predicates"""

[exercises.error_notes]
TS2322 = "`filter(Boolean)` keeps the array's element type, `number | undefined`. TypeScript only narrows the result when the callback checks its argument's type, e.g. an arrow function comparing it with `undefined`."

[[exercises]]
name = "arrays4"
dir = "04_arrays_tuples"
hint = """
A tuple type lists one type per position: `[number, number]`. Labels go
before each type (`[longitude: number, ...]`) and an optional last element
gets a `?` after its label.

Once `Position` is a tuple, `altitude` is `number | undefined`. Compare it
with `undefined` (an altitude of 0 is valid) and build the longer string.
https://www.typescriptlang.org/docs/handbook/2/objects.html#tuple-types"""

[exercises.error_notes]
TS18048 = "`Position` is `number[]`, so TypeScript can't promise the array has a first or a second element: each destructured value may be `undefined`. Make `Position` a tuple (see the TODO): the positions it declares are always there."
TS2532 = "While `Position` is a `number[]`, reading `a[0]` or `b[1]` may give `undefined`: the array could be too short. Once `Position` is a tuple, its first two positions are always numbers and these errors go away."
TS2344 = "A type test failed: `Position` must be a tuple of two required numbers followed by an optional one. The expected type shows no labels because labels don't count when tuple types are compared: keep yours."

[[exercises]]
name = "arrays5"
dir = "04_arrays_tuples"
hint = """
`resizeWindow` takes exactly two numbers, so the spread value must be a
tuple of two numbers.
- `DEFAULT_SIZE`: add `as const` after the array literal.
- `parseSize`: write the return type after the parameter list, as a tuple
  with a label for each position.
https://www.typescriptlang.org/docs/handbook/2/objects.html#readonly-tuple-types"""

[exercises.error_notes]
TS2556 = "The spread value is a `number[]`, which could hold any number of elements, but `resizeWindow` needs exactly two. Give the value a tuple type: `as const` for the constant, a return type annotation for `parseSize`."
TS2344 = "A type test failed. `DEFAULT_SIZE` must be the readonly tuple of literals that `as const` gives. `parseSize` must declare a plain tuple as its return type, `[width: number, height: number]`: `as const` on the returned array would make the pair readonly for every caller, and wouldn't say what each number means."

# -------------------- 05_objects.toml --------------------

# OBJECTS

[[exercises]]
name = "objects1"
dir = "05_objects"
hint = """
Inside the braces of an interface, list each property as `name: type;`.
To build on another interface, write `interface DigitalProduct extends Product`
and only list what's new. A type alias can do the same with `&`: write
`Product`, an `&`, then an object type with the extra property.
https://www.typescriptlang.org/docs/handbook/2/objects.html#extending-types
https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types"""

[exercises.error_notes]
TS2339 = "`Product`, `DigitalProduct` and `CartLine` are still empty object types, so TypeScript doesn't know about any of their properties yet. Describe them as the TODOs say."
TS2344 = "A type test failed: compare the TODO of the type on the `found` line with the `expected` line (for an interface, `found` only shows its name). `CartLine` must be written with `&`: listing the four properties again gives the same shape, but the type test tells the two spellings apart."

[[exercises]]
name = "objects2"
dir = "05_objects"
hint = """
The object may only contain `phone` when there is a phone number. Two common
ways to write that:
- build the required part first, then add each optional property in an `if`;
- spread a conditional object: `...(condition ? {} : { key: value })`.
https://www.typescriptlang.org/tsconfig/#exactOptionalPropertyTypes"""

[exercises.error_notes]
TS2375 = "With `exactOptionalPropertyTypes`, an optional property like `phone?: string` may be missing, but not set to `undefined`. TypeScript suggests adding `undefined` to the property types of `Contact`. Don't: a key set to `undefined` still counts as present for `in` and `Object.keys`. Leave the property out of the object when the field is empty."

[[exercises]]
name = "objects3"
dir = "05_objects"
hint = """
`{ ...prefs, theme }` is a new object with every property of `prefs`, except
`theme`, which takes the new value.
For the channels, spread works on arrays too: `[...list, item]` is a new array
with one more element.
https://www.typescriptlang.org/docs/handbook/2/objects.html#readonly-properties"""

[exercises.error_notes]
TS2540 = "`theme` is `readonly`: the object can't be changed. Return a new object instead, made with spread syntax, with the new theme in it."
TS2339 = "`mutedChannels` is a `readonly string[]`, which has no `push`. Build a new array that holds the old channels plus the new one."

[[exercises]]
name = "objects4"
dir = "05_objects"
hint = """
For `POLICY`, read TypeScript's suggestion: it knows the property names of
`RetryPolicy`.
For the logger: `withRetries` calls two methods on its logger, and the
memory logger only has one. Add the other one, recording lines in the same
format ("warn: ..."). The extra `lines` property can stay: extra properties
are fine for a value that isn't a fresh object literal.
https://www.typescriptlang.org/docs/handbook/type-compatibility.html"""

[exercises.error_notes]
TS2561 = "Object literals may only list properties their type knows about. This catches typos, which matters most for optional properties: without this check, a misspelled option would be silently ignored."
TS2344 = "A type test fails. Keep `RetryPolicy` as it is, and keep the `RetryPolicy` annotation on `POLICY`: the annotation is what triggers the check that found the typo. Fix the property name instead."
TS2741 = "The memory logger doesn't have every method that `Logger` requires. Structural typing only needs the right members, so add the missing one to the object that `createMemoryLogger` returns."

[[exercises]]
name = "objects5"
dir = "05_objects"
hint = """
`Record<Keys, Value>` takes the allowed keys as its first type argument. Use
`Locale` there, and TypeScript will ask for one entry per locale.
For the flags, the keys really are open-ended, so the `undefined` case is
real: decide what a missing flag means and return that.
https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type"""

[exercises.error_notes]
TS2322 = "With `string` keys, any key may be missing, so a read gives `V | undefined`. If this is the `GREETINGS` read: that object only needs the `Locale` keys, so give it a type that lists them, and the read becomes safe. If it's the flags read: their keys really are open-ended, so decide what a missing flag means."
TS2741 = "`Record<Locale, string>` requires one entry per locale, and this one is missing. Add it to the object; that check is the reason to use a `Record` here."
TS2344 = "A type test failed: `GREETINGS` must be typed with `Locale` as its keys, `Record<Locale, string>`, instead of `string` keys. That type is what makes TypeScript demand a greeting for every locale."

# -------------------- 06_collections.toml --------------------

# COLLECTIONS

[[exercises]]
name = "collections1"
dir = "06_collections"
hint = """
Type arguments go between `<` and `>` right after `Map`: first the key type,
then the value type.
Once the Map is typed, `get` returns `number | undefined`. A client that isn't
in the Map yet has made 0 requests: supply that default (`??` does it in one
step). In `remaining`, call `get` once, store the result, and compare it with
`undefined` instead of calling `has`.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map"""

[exercises.error_notes]
TS2344 = "`requestCounts` is a `Map<any, any>`: `new Map()` has no entries and no type arguments to learn its types from. Write the key and value types between `<>` after `Map`, then fix the errors that appear."
TS2532 = "`get` returns `number | undefined`: the client may not be in the Map. Give it a default, or check the value you got back. A `has` check doesn't help, since TypeScript doesn't link it to the `get` call."

[[exercises]]
name = "collections2"
dir = "06_collections"
hint = """
Put the element type between `<>` after `Set`, as the tests do with
`new Set<Permission>(...)`.
Each function body is one expression made of the methods listed at the top:
they return new sets, so you can chain them (`a.union(b).difference(c)`).
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set#set_composition"""

[exercises.error_notes]
TS2355 = "This function is still empty. Return a value built with the Set methods listed at the top of the file."
TS2322 = "`VIEWER` and `EDITOR` were inferred as `Set<string>`, and not every string is a `Permission`. Give `new Set` the element type explicitly where the constants are declared: `new Set<Permission>([...])`."
TS2344 = "A type test failed: `VIEWER` and `EDITOR` must be `Set<Permission>`, not `Set<string>`. Pass the element type to `new Set` where each constant is declared."

[[exercises]]
name = "collections3"
dir = "06_collections"
hint = """
Annotate the constant with `Record<Zone, number>` and write it as an object
literal: `{ domestic: 5, ... }`. Reading a rate is then `SHIPPING_RATE[zone]`.
For the list, `Object.entries(obj)` returns `[key, value]` pairs: destructure
each pair in the `map` callback's parameter.
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/entries"""

